# Deep Research — default runtime configuration
# Override values with uppercase full-path environment variable names (for example,
# LLM_MODEL or MEMORY_LONG_TERM_PERSIST_DIRECTORY).

llm:
  provider: openai
  model: gpt-4o
  embedding_model: text-embedding-3-small
  model_overrides: {}
  timeout: 60.0
  retry_count: 2
  temperature: 0.7
  max_tokens: 4096
  reasoning_effort:
  reasoning_mode: standard

langsmith:
  tracing_enabled: false
  project: ""

tavily:
  search_depth: basic
  max_results: 5

memory:
  long_term:
    collection_name: deep_research
    persist_directory: memory/
  short_term:
    max_turns: 20
  procedural:
    strategies_path: memory/strategies.json

agents:
  max_iterations: 5
  tool_budget: 10
  prompt_context_entries: 8
  observation_summary_chars: 200

graph:
  max_iterations: 3
  checkpointing_enabled: false

output:
  directory: output/
  default_format: markdown

evaluation:
  controlled_repetitions: 3
  controlled_case_average_threshold: 0.80
  controlled_repetition_floor: 0.65
  live_repetitions: 1
  live_threshold: 0.75
  target_model: gpt-5.6-luna
  target_reasoning_effort: medium
  target_reasoning_effort_overrides:
    planner: medium
    researcher: low
    source_evaluator: low
    fact_checker: medium
    synthesizer: medium
    critic: medium
  judge_model: gpt-5.6-luna
  judge_reasoning_effort: high
  reasoning_mode: standard
  embedding_model: text-embedding-3-small
  judge_temperature: 0.0
  max_concurrency: 1
  output_directory: output/evaluations/
  dataset_version: 1
  rubric_version: 1
