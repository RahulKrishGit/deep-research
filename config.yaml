# Deep Research — default runtime configuration
# Override any value via environment variable with the same key name.

llm:
  provider: openai
  model: gpt-4o
  temperature: 0.7
  max_tokens: 4096

langsmith:
  tracing_enabled: false
  project: ""

tavily:
  search_depth: basic
  max_results: 5

memory:
  long_term:
    collection_name: deep_research
    persist_directory: memory/
  short_term:
    max_turns: 20

output:
  directory: output/
  default_format: markdown
