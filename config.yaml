# Deep Research — default runtime configuration
# Override values with uppercase full-path environment variable names (for example,
# LLM_MODEL or MEMORY_LONG_TERM_PERSIST_DIRECTORY).

llm:
  provider: deepseek
  model: deepseek-v4-flash
  embedding_model: text-embedding-3-small
  thinking_mode: enabled
  reasoning_effort: high
  model_overrides: {}
  timeout: 60.0
  retry_count: 2
  temperature: 0.7
  max_tokens: 4096

langsmith:
  tracing_enabled: false
  project: ""

tavily:
  search_depth: basic
  max_results: 5

memory:
  long_term:
    collection_name: deep_research
    persist_directory: memory/
  short_term:
    max_turns: 20
  procedural:
    strategies_path: memory/strategies.json

agents:
  max_iterations: 5
  tool_budget: 10
  prompt_context_entries: 8
  observation_summary_chars: 200

graph:
  max_iterations: 3
  checkpointing_enabled: false

output:
  directory: output/
  default_format: markdown
