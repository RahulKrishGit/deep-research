# Deep Research — default runtime configuration
# Override values with uppercase full-path environment variable names (for example,
# LLM_MODEL or MEMORY_LONG_TERM_PERSIST_DIRECTORY).

llm:
  provider: deepseek
  model: deepseek-v4-flash
  embedding_provider: local
  embedding_model: text-embedding-3-small
  thinking_mode: enabled
  # Finalized at `high` for every agent. DeepSeek V4 Flash supports only `high`
  # and `max`, and `high` is the cheaper of the two enabled levels while still
  # being a genuine reasoning setting; the live canary re-runs at this value.
  # This global value is the default for any agent ``model_overrides`` does not
  # name.
  reasoning_effort: high
  # Per-agent reasoning profiles for the production CLI. The measured
  # configuration ran the planner, fact checker, synthesizer and critic at
  # `max` and the researcher and source evaluator at `high`; before this table
  # existed production could express only one effort for all six agents, so an
  # evaluation run resolved a per-agent profile the CLI could not reproduce
  # (baseline §6.2, D-10). This is a testable candidate measured to be at least
  # as good, not proof that `max` is always better for every question.
  model_overrides:
    planner:
      reasoning_effort: max
    fact_checker:
      reasoning_effort: max
    synthesizer:
      reasoning_effort: max
    critic:
      reasoning_effort: max
    researcher:
      reasoning_effort: high
    source_evaluator:
      reasoning_effort: high
    # The terminal semantic report judge is a *service role*, not a seventh
    # agent: it holds no tool loop and no slot in the six-agent registry, but it
    # resolves its model and effort here like one, so the review that decides
    # whether a report is accepted is independently configured from every agent
    # whose work it judges. `max` because a wrong acceptance is more expensive
    # than a slower review.
    report_judge:
      reasoning_effort: max
  timeout: 60.0
  # Repo-owned retry policy: up to 5 retries with exponential backoff from
  # 1s doubling to a 16s cap (the openai SDK only exposes max_retries with a
  # fixed 0.5s/8s internal backoff, so the policy lives in providers/retry.py).
  retry_count: 5
  retry_initial_delay: 1.0
  retry_max_delay: 16.0
  temperature: 0.7
  # Default output budget. Most operations use 32768; the planner's plan
  # requests and terminal report review use 65536. Both reason at `max`
  # effort, where thinking consumes completion tokens as well as the answer.
  # The operation-specific bounds below are provider-tested headroom, not
  # known provider maxima. A cap unused by the model costs no output tokens;
  # a cap reached before the JSON reply costs a whole request.
  max_tokens: 32768

langsmith:
  # On by default, per direct instruction. Two settings deliberately stay in
  # .env instead of here: LANGSMITH_API_KEY (a credential) and
  # LANGSMITH_ENDPOINT (the LangSmith SDK reads it straight from the
  # environment and there is no config.yaml equivalent for it).
  tracing_enabled: true
  project: deep-research-dev

tavily:
  search_depth: basic
  max_results: 5

memory:
  long_term:
    collection_name: deep_research
    persist_directory: memory/
  short_term:
    max_turns: 20
  procedural:
    strategies_path: memory/strategies.json

agents:
  source_evaluator:
    # Score new canonical URLs in bounded provider batches, while retaining a
    # complete explicit record for every source beyond the run cap.
    batch_size: 12
    max_total_sources: 36
  max_iterations: 5
  tool_budget: 10
  # One agent's ReAct loop can be bounded harder than the global budget. The
  # planner's budget is 1 because the session's own startup memory recall IS
  # its procedural lookup: the planner runs no second hidden recall, and its
  # one permitted lookup happens only when startup recall returned no
  # guidance. source_evaluator and synthesizer need no tools at all; the fact
  # checker keeps the researcher's ten. The critic is 0 because Task 8 removed
  # its tool path entirely: it reviews the exact candidate's packet, and its
  # historical search/memory spot check could not open a page, so it could
  # never establish missing support and its snippets were never evidence.
  tool_budget_overrides:
    planner: 1
    researcher: 10
    fact_checker: 10
    source_evaluator: 0
    synthesizer: 0
    critic: 0
  # How many planned sub-topics one Researcher pass attempts
  # (AGENTS_MAX_SUB_TOPICS overrides this). Seven is the Planner's own ceiling,
  # so the default attempts the whole plan. A smaller cap silently drops the
  # least important planned sub-topics; each dropped one is recorded as
  # researcher_sub_topic_skipped with its coverage id, but the report is short
  # for it regardless.
  max_sub_topics: 7
  # Exact target-bearing passages retained from each successful read.
  selected_passages_per_read: 4
  # Maximum serialized acquisition/evidence context sent in one packet.
  evidence_packet_chars: 24000
  prompt_context_entries: 8
  observation_summary_chars: 200
  # How many claims one Fact Checker adjudication batch takes, and how many
  # batches one pass runs. These replace the hidden five-claim prefix that used
  # to be fact_checker.DEFAULT_MAX_CLAIMS: a measured run accepted exactly five
  # claims in every extraction batch, so a sixth claim the model returned did
  # not exist and the topics behind it were starved. Everything a pass does not
  # adjudicate stays pending and is reported as pending, never dropped.
  # (AGENTS_CLAIM_BATCH_SIZE / AGENTS_CLAIM_BATCHES_PER_PASS override these.)
  claim_batch_size: 5
  claim_batches_per_pass: 6
  # Operation-specific output budget for the planner's plan-side structured
  # requests: the plan draft and its repairs, the plan review, and plan
  # extensions. ReAct decisions and judge calls keep llm.max_tokens
  # (AGENTS_PLANNER_FINAL_MAX_TOKENS overrides this).
  #
  # This is the one budget that deliberately exceeds the global cap. The
  # planner reasons at `max` effort, DeepSeek bills a reasoning token as a
  # completion token, so a plan request shares this budget with its own
  # thinking. A live run truncated a plan-side request exactly at the old cap
  # -- finish_reason=length, 32768 completion tokens, ProviderOutputLimitError
  # -- and that error is nonretryable by design, so the run stopped before
  # research began. The provider accepts 65536: later live runs completed plan
  # requests at this cap with thinking enabled. No larger value was tested, so
  # this is not a known provider maximum, and no later run has yet needed the
  # extra headroom. This buys headroom, it does not remove the class: a
  # request that reasons past this cap still stops the run, and the durable
  # fix is a bounded degraded retry, not a third larger number.
  planner_final_max_tokens: 65536
  # Operation-specific output budget for the Critic's report-review request
  # only (AGENTS_CRITIC_REVIEW_MAX_TOKENS overrides this). That call renders
  # the report, the claims, the source scores, and the spot-check evidence,
  # then asks for a score plus three lists plus a rationale in one object. At
  # 4096 it returned non-JSON text on both the initial attempt and the single
  # repair in three consecutive live canaries.
  critic_review_max_tokens: 32768
  # Operation-specific cap for the terminal reviewer (whole-report and
  # evidence-batch requests; AGENTS_REPORT_REVIEW_MAX_TOKENS overrides it).
  # Pre-flight reported finish=length and exactly 32768 completion tokens on
  # a whole-report call, including its thinking. A thinking-enabled planner
  # request has completed at 65536 with this provider. This is headroom, not
  # a known provider maximum; the bounded high-effort retry still applies.
  report_review_max_tokens: 65536
  # Operation-specific output budget for the judge's JudgeVerdict request
  # (AGENTS_JUDGE_MAX_TOKENS overrides this). The verdict carries six common
  # dimensions, the agent-specific dimensions, and a rationale; once the
  # Critic began producing a real critique the judge hit the global cap and
  # returned judge_output_limit with no score at all.
  judge_max_tokens: 32768
  # Output budget for every ReAct decision request
  # (AGENTS_REACT_DECISION_MAX_TOKENS overrides this). A live Critic repetition
  # recorded {kind: output_limit, operation: react_decision}: the spot-check
  # decision hit the global cap and was truncated, which degrades the
  # spot-check phase silently rather than failing the run. A decision carries
  # the agent's reasoning, one tool call, and that call's arguments.
  react_decision_max_tokens: 32768

graph:
  max_iterations: 3
  checkpointing_enabled: false

output:
  directory: output/
  default_format: markdown

evaluation:
  controlled_repetitions: 3
  controlled_case_average_threshold: 0.80
  controlled_repetition_floor: 0.65
  live_repetitions: 1
  live_threshold: 0.75
  target_model: deepseek-v4-flash
  target_reasoning_effort: max
  target_reasoning_effort_overrides:
    researcher: high
    source_evaluator: high
  judge_model: deepseek-v4-flash
  judge_reasoning_effort: max
  judge_temperature: 0.0
  max_concurrency: 1
  output_directory: output/evaluations/
  dataset_version: 1
  rubric_version: 1
